info:
  name: Metabase SAP HANA Driver
  version: 0.1.0-SNAPSHOT
  description: Allows Metabase to connect to SAP HANA databases.
driver:
  name: hanadb
  display-name: SAP HANA
  lazy-load: true
  parent: sql-jdbc
  connection-properties:
    - host
    - merge:
        - port
        - placeholder: 30015
    - merge:
        - dbname
        - name: dbname
          display-name: Database name
          placeholder: SYSTEMDB or tenant database
          required: false
    - name: schema
      display-name: Current schema
      placeholder: Optional default schema for unqualified identifiers
      required: false
    - merge:
        - user
        - placeholder: example_user
    - password
    - ssl
    - ssh-tunnel
    - advanced-options-start
    - merge:
        - additional-options
        - placeholder: 'encrypt=true&validateCertificate=false'
    - default-advanced-options
init:
  - step: load-namespace
    namespace: metabase.driver.hanadb
  - step: register-jdbc-driver
    class: com.sap.db.jdbc.Driver
